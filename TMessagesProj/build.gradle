configurations.implementation {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}

apply plugin: 'com.google.gms.google-services'
apply plugin: 'com.google.firebase.crashlytics'
apply plugin: 'androidx.baselineprofile'

def isPmBuild = "false"
def abiConfig = [
        armv7: ['armeabi-v7a', 1, 'armeabi-v7a'],
        x86  : ['x86', 2, 'x86'],
        arm64: ['arm64-v8a', 5, 'arm64-v8a'],
        x64  : ['x86_64', 6, 'x86_64']
]
def requestedTasks = gradle.startParameter.taskNames.collect { it.toLowerCase() }
def requestedMinApiFlavors = abiConfig.keySet().findAll { flavorName ->
    requestedTasks.any { it.contains(flavorName.toLowerCase()) }
} as Set
def defaultAbiFlavors = ['arm64', 'x64'] as Set
def enabledAbiConfig = requestedMinApiFlavors ?
        abiConfig.findAll { name, _ -> requestedMinApiFlavors.contains(name) } :
        abiConfig.findAll { name, _ -> defaultAbiFlavors.contains(name) }
def flavorAbiSets = enabledAbiConfig.collectEntries { name, config ->
    [(name): [config[2]] as Set]
} + [
        afat: ['armeabi-v7a', 'arm64-v8a'] as Set,
        beta: ['armeabi-v7a', 'arm64-v8a'] as Set
]

apply from: "$projectDir/gradle/extera-locales.gradle"
apply from: "$projectDir/gradle/extera-appicons.gradle"

android {
    compileSdkVersion 37
    buildToolsVersion "36.0.0"
    ndkVersion = "29.0.14206865"
    namespace = 'org.telegram.messenger'

    baselineProfile {
        dexLayoutOptimization = true
        warnings {
            disabledVariants = false
        }
    }

    Properties localProperties = new Properties()
    if (project.rootProject.file('API_KEYS').exists()) {
        localProperties.load(project.rootProject.file('API_KEYS').newDataInputStream())
    }

    defaultConfig {
        applicationId = APP_PACKAGE
        versionCode = Integer.parseInt(APP_VERSION_CODE)
        minSdkVersion 24
        targetSdkVersion 36
        versionName = APP_VERSION_NAME

        ksp {
            arg("room.schemaLocation", "$projectDir/schemas")
        }

        // Obtain your own keys at: https://core.telegram.org/api/obtaining_api_id
        buildConfigField 'int', 'APP_ID', localProperties.getProperty("APP_ID")
        buildConfigField 'String', 'APP_HASH', localProperties.getProperty("APP_HASH")
        buildConfigField 'boolean', 'DEBUG_PRIVATE_VERSION', 'false'

        // Google Console: https://console.cloud.google.com/google/maps-apis/credentials
        resValue 'string', 'MAPS_V2_API', localProperties.getProperty("MAPS_V2_API")

        vectorDrawables.generatedDensities = ['mdpi', 'hdpi', 'xhdpi', 'xxhdpi']
        multiDexEnabled = true

        externalNativeBuild {
            cmake {
                version = '4.0.0+'
                arguments '-DANDROID_PLATFORM=android-23' //, '-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON'
            }
        }
    }

    androidResources {
        noCompress += "pack"
        localeFilters += ["zz"]
    }

    externalNativeBuild.cmake.path 'jni/CMakeLists.txt'

    sourceSets {
        main {
            jniLibs.srcDirs = ['jni', 'jniLibs']
            res.srcDirs = ['src/main/res', 'src/main/res-appicons', 'src/main/res-solar', 'src/main/res-remix', 'src/main/res-tabs']
        }
    }

    lint {
        checkReleaseBuilds false
        disable 'MissingTranslation', 'ExtraTranslation', 'BlockedPrivateApi'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }

    kotlin {
        compilerOptions {
            jvmTarget.set(JvmTarget.JVM_17)
        }
    }

    signingConfigs {
        release {
            storeFile file("config/exteraGram.jks")
            storePassword localProperties.getProperty("SIGNING_KEY_STORE_PASSWORD")
            keyAlias localProperties.getProperty("SIGNING_KEY_ALIAS")
            keyPassword localProperties.getProperty("SIGNING_KEY_PASSWORD")
        }
    }

    packagingOptions {
        resources {
            excludes += ['META-INF/DEPENDENCIES']
        }
        jniLibs {
            useLegacyPackaging true
            pickFirsts += ['**/libc++_shared.so', '**/libshadowhook.so']
        }
    }

    buildTypes {
        debug {
            debuggable false
            jniDebuggable false
            signingConfig signingConfigs.release
            minifyEnabled false
            shrinkResources false
            multiDexEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            buildConfigField "String", "BUILD_VERSION_STRING", "\"$APP_VERSION_NAME\""
            buildConfigField "boolean", "DEBUG_VERSION", "true"
            buildConfigField "boolean", "IS_PM_BUILD", isPmBuild
            matchingFallbacks = ['release']
        }

        release {
            jniDebuggable false
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            multiDexEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            ndk.debugSymbolLevel = 'FULL'
            buildConfigField "String", "BUILD_VERSION_STRING", "\"$APP_VERSION_NAME\""
            buildConfigField "boolean", "DEBUG_VERSION", "false"
            buildConfigField "boolean", "IS_PM_BUILD", isPmBuild
        }
    }

    flavorDimensions "appType", "minApi"

    productFlavors {
        lite {
            dimension "appType"
            proguardFiles 'proguard-rules-lite.pro'
            buildConfigField "boolean", "EXTERA_HOOK_EMBEDDED", "false"
            externalNativeBuild {
                cmake {
                    arguments "-DANDROID_STL=c++_static", "-DEXTERA_HOOK_EMBEDDED=OFF"
                }
            }
        }

        full {
            dimension "appType"
            proguardFiles 'proguard-rules-full.pro'
            buildConfigField "boolean", "EXTERA_HOOK_EMBEDDED", "true"
            buildConfigField "int", "EXTERA_ANALYZER_APP_VERSION_CODE", APP_VERSION_CODE
            externalNativeBuild {
                cmake {
                    arguments "-DANDROID_STL=c++_shared", "-DEXTERA_HOOK_EMBEDDED=ON"
                }
            }
        }

        enabledAbiConfig.each { name, config ->
            register(name) {
                dimension "minApi"
                //noinspection ChromeOsAbiSupport
                ndk.abiFilters config[0]
                ext.abiVersionCode = config[1]
                ext.abiName = config[2]
            }
        }

        afat {
            dimension "minApi"
            ndk.abiFilters "armeabi-v7a", "arm64-v8a"
            sourceSets.release.manifest.srcFile 'config/release/AndroidManifest.xml'
            ext.abiVersionCode = 9
            ext.abiName = 'universal'
        }

        beta {
            dimension "minApi"
            //noinspection ChromeOsAbiSupport
            ndk.abiFilters "armeabi-v7a", "arm64-v8a"
            sourceSets.debug.manifest.srcFile 'config/debug/AndroidManifest.xml'
            ext.abiVersionCode = 9
            ext.abiName = 'universal'
        }
    }

    buildFeatures {
        buildConfig true
        resValues true
        prefab true
        aidl true
    }
    bundle.language.enableSplit false
    dependenciesInfo.includeInApk false
}

androidComponents {
    beforeVariants(selector().all()) { variant ->
        def names = variant.productFlavors.collect { it.second }
        if (names.contains("full") && (names.contains("x86") || names.contains("x64"))) {
            variant.enable = false
            return
        }

        def isBeta = names.contains("beta")
        def buildTypeName = variant.buildType
        def shouldEnable = (isBeta && (buildTypeName == "debug" || buildTypeName == "benchmarkDebug" || buildTypeName == "nonMinifiedRelease")) ||
                (!isBeta && (buildTypeName == "debug" || buildTypeName == "release" || buildTypeName == "benchmarkRelease" || buildTypeName == "nonMinifiedRelease"))
        variant.enable = shouldEnable
    }

    onVariants(selector().all()) { variant ->
        def appTypeFlavorName = variant.productFlavors.find { it.first == "appType" }?.second
        def apiFlavorName = variant.productFlavors.find { it.first == "minApi" }?.second
        if (appTypeFlavorName == null || apiFlavorName == null) {
            return
        }

        def buildTypePrefix = apiFlavorName == "beta" ? "beta-" : ""
        def formattedDate = new Date().format('yyyyMMdd')
        def abi = abiConfig.containsKey(apiFlavorName) ? abiConfig[apiFlavorName][2] : 'universal'
        def abiVersionCode = abiConfig.containsKey(apiFlavorName) ? abiConfig[apiFlavorName][1] : 9
        def baseVersionCode = android.defaultConfig.versionCode

        variant.outputs.each { output ->
            output.outputFileName.set("exteraGram-${appTypeFlavorName}-${buildTypePrefix}${abi}-${formattedDate}.apk")
            output.versionCode.set(baseVersionCode * (isPmBuild == "true" ? 100 : 10) + abiVersionCode)
        }
    }
}

