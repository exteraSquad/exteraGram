androidComponents {
    onVariants(selector().all()) { variant ->
        def minApiFlavor = variant.productFlavors.find { it.first == "minApi" }?.second
        def allowedAbis = flavorAbiSets[minApiFlavor]

        if (allowedAbis != null) {
            ['armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'].findAll { !allowedAbis.contains(it) }.each { abi ->
                variant.packaging.jniLibs.excludes.add("**/${abi}/**")
            }
        }
    }
